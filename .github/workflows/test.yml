name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-grib.txt
      - name: GDAL (test réel de tiler/gdal_adapter.py)
        run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin
      - name: Dépendances (avec cfgrib/eccodes)
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-grib.txt -r tiler/requirements.txt pytest
      - name: Tests (niveaux 1 et 2)
        run: python -m pytest -v
      - name: Contrôle HISTORY.md
        run: python tools/history_check.py
      - name: Dry-run contre NOMADS réel
        if: ${{ !cancelled() }}
        run: python -m pipeline.main --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dry-run
          path: out/
          retention-days: 3

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 3

  deploy:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Déploiement Workers Static Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
