<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Globe 3D de la météo mondiale : température, nuages, pluie, pression, humidité, qualité de l'air (NOAA GFS et GEFS-Aerosols)." />
    <title>GlobeLayers — météo mondiale en 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="globe" aria-label="Globe 3D météo"></canvas>
    <div id="overlay">
      <header id="banner" class="panel">
        <span id="banner-text">Chargement…</span>
        <button id="toggle-overlay" type="button" aria-expanded="true" aria-controls="legend controls" aria-label="Replier ou déployer les panneaux">▾</button>
      </header>
      <div id="status" class="panel" role="status" hidden></div>
      <aside id="legend" class="panel" aria-label="Légende de la couche"></aside>
      <aside id="controls" class="panel"></aside>
      <p id="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> · NASA · GEBCO · Natural Earth · NOAA GFS · GEFS-Aerosols</p>
      <div id="ad-slot" hidden></div>
    </div>
    <div id="tooltip" class="panel" role="status" aria-live="off" hidden></div>
    <div id="marker" aria-hidden="true" hidden></div>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
